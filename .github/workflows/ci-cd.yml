name: CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

  build:
    name: Docker Build and Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t splitly:${{ github.sha }} .

      - name: Start MongoDB
        run: |
          docker network create splitly-test-network
          docker run -d \
            --name splitly-mongo \
            --network splitly-test-network \
            mongo:7

          for i in {1..30}; do
            if docker exec splitly-mongo mongosh --quiet --eval "db.adminCommand('ping')" > /dev/null; then
              break
            fi
            echo "Waiting for MongoDB ($i/30)..."
            sleep 2
          done

          docker exec splitly-mongo mongosh --quiet --eval "db.adminCommand('ping')"

      - name: Start container
        run: |
          docker run -d \
            --name splitly-test \
            --network splitly-test-network \
            -p 3000:3000 \
            -e MONGODB_URI=mongodb://splitly-mongo:27017/splitly \
            splitly:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi
            echo "Waiting for application ($i/30)..."
            sleep 2
          done

          echo "Container logs:"
          docker logs splitly-test
          exit 1

      - name: Stop containers
        if: always()
        run: |
          docker rm -f splitly-test splitly-mongo || true
          docker network rm splitly-test-network || true

  deploy:
    name: Deploy to Render
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST \
          "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"